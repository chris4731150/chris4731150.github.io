<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4fb8e8">
<style>[hidden]{display:none!important}html,body{margin:0}</style>
</head>
<body>
<title>Cuisine du Port</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap">
<style>
[hidden]{display:none!important}
/* Mise en page : jeu de fusion-cuisine sur une colonne — barre de ressources, scène du port avec les clients, plateau 7×8, fiche de l'objet, onglets — thème clair « bord de mer » assumé */
:root{
  --ciel:#8fd3f7; --mer:#2f8fcf; --mer-fonce:#1f6fa8;
  --creme:#fff8ec; --case:#f6ecd9; --case2:#efe2c8; --bois:#c98a4b; --bois-fonce:#8a5a2b;
  --encre:#3b2a1e; --doux:#8a7563; --or:#ffb627; --vert:#2fb36b; --rouge:#ef5b5b; --violet:#8b6cf0; --blanc:#ffffff;
  --f-titre:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --f-texte:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:linear-gradient(180deg,var(--ciel),var(--mer) 70%,var(--mer-fonce));color:var(--encre);font-family:var(--f-texte);font-size:14px;overflow:hidden;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.jeu{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-block:6px 0;box-sizing:border-box;gap:5px}
.vue-cuisine{gap:5px}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
button:focus-visible{outline:3px solid var(--or);outline-offset:2px}

/* Ressources */
.ress{display:flex;gap:6px;align-items:center}
.niveau{flex:none;position:relative;width:44px;height:44px;border-radius:50%;background:conic-gradient(var(--or) var(--xp,0%),rgba(255,255,255,.5) 0);display:grid;place-items:center;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.niveau span{width:34px;height:34px;border-radius:50%;background:var(--blanc);display:grid;place-items:center;font-family:var(--f-titre);font-weight:700;font-size:16px;color:var(--bois-fonce)}
.pilule{flex:1;min-width:0;display:flex;align-items:center;gap:4px;background:var(--blanc);border-radius:999px;padding:4px 6px 4px 4px;font-weight:900;font-variant-numeric:tabular-nums;box-shadow:0 2px 0 rgba(0,0,0,.15);font-size:14px;white-space:nowrap;overflow:hidden}
.pilule i{font-style:normal;font-size:18px;flex:none}
.pilule span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.pilule small{display:block;font-size:10px;color:var(--doux);font-weight:800;line-height:1}
.plus{flex:none;width:20px;height:20px;border-radius:50%;background:var(--vert);color:var(--blanc);font-weight:900;display:grid;place-items:center;font-size:15px;line-height:1}

/* Scène du port */
.scene{position:relative;flex:none;height:122px;border-radius:18px;overflow:hidden;box-shadow:0 3px 0 rgba(0,0,0,.18);
  background:linear-gradient(180deg,#bfe9ff 0,#e9f8ff 38%,#5fb6e6 38%,#3a9ad6 58%,var(--bois) 58%,#b77a3f 100%)}
.scene::before{content:"";position:absolute;left:0;right:0;top:58%;height:4px;background:var(--bois-fonce);opacity:.5}
.scene .soleil{position:absolute;right:14px;top:8px;font-size:26px}
.deco{position:absolute;transform:translate(-50%,-50%);line-height:1;filter:drop-shadow(0 2px 1px rgba(0,0,0,.2))}
.deco.neuve{animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
.enseigne{position:absolute;left:10px;top:8px;background:var(--bois-fonce);color:var(--creme);font-family:var(--f-titre);font-weight:600;font-size:13px;padding:3px 10px;border-radius:8px;border:2px solid #f3d3a5}
.clients{position:absolute;left:6px;right:6px;bottom:6px;display:flex;gap:6px;overflow-x:auto;overflow-y:visible;scroll-snap-type:x mandatory;scrollbar-width:none;padding-top:14px;margin-top:-14px;-webkit-overflow-scrolling:touch}
.clients::-webkit-scrollbar{display:none}
.clients>*{flex:0 0 calc((100% - 12px)/3);scroll-snap-align:start}
.clients-pts{position:absolute;left:0;right:0;bottom:-1px;display:flex;justify-content:center;gap:4px;z-index:4;pointer-events:none}
.clients-pts i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 0 2px rgba(0,0,0,.4)}
.clients-pts i.on{background:#fff}.clients-pts i.pret{background:#2fb35c}
.clients-fleche{position:absolute;right:2px;bottom:38px;z-index:4;width:22px;height:34px;border:0;border-radius:10px;background:rgba(255,250,240,.9);box-shadow:0 2px 5px rgba(0,0,0,.3);font-weight:900;color:#7a5a36;font-size:16px;display:grid;place-items:center;padding:0}
.clients-fleche.g{right:auto;left:2px}.clients-fleche.pret{background:#2fb35c;color:#fff;animation:flecheP 1s ease-in-out infinite}
@keyframes flecheP{50%{transform:scale(1.15)}}
.client{background:rgba(255,248,236,.96);border-radius:14px;padding:5px 5px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 2px 0 rgba(0,0,0,.15);border:2px solid transparent;min-width:0;position:relative}
.client.pret{border-color:var(--vert);animation:respire 1.2s ease-in-out infinite}
@keyframes respire{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.client .tete{display:flex;align-items:center;justify-content:center;gap:4px;width:100%;min-width:0}
.client .av{font-size:24px;flex:none}
.client .nom{font-size:10.5px;font-weight:900;color:var(--doux);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;line-height:1.1}
.client .demandes{display:flex;gap:3px}
.demande{position:relative;width:30px;height:30px;border-radius:9px;background:var(--case);display:grid;place-items:center;font-size:20px}
.demande.ok::after{content:"✓";position:absolute;right:-4px;bottom:-4px;width:15px;height:15px;border-radius:50%;background:var(--vert);color:var(--blanc);font-size:10px;font-weight:900;display:grid;place-items:center}
.client .gain{font-size:10.5px;font-weight:900;color:var(--bois-fonce);white-space:nowrap;line-height:1.1}
.client{padding:4px 4px 5px;gap:1px}
.enseigne{display:none}
#btnEnergie{flex:1.15}
.pilule{gap:3px;font-size:13.5px;padding:4px 4px 4px 3px}
.pilule i{font-size:16px}
.plus{width:18px;height:18px;font-size:14px}
.client .servir{position:absolute;inset:auto 4px 4px;background:var(--vert);color:var(--blanc);border-radius:9px;font-weight:900;font-size:12px;padding:3px 0}
.client.vide{background:rgba(255,248,236,.55);color:var(--doux);font-weight:800;font-size:11px;justify-content:center;min-height:70px}

/* Plateau */
.vue-cuisine{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
.plateau-cadre{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.plateau{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:4px;border-radius:16px;background:var(--creme);box-shadow:0 3px 0 rgba(0,0,0,.18),inset 0 0 0 2px #f1dfbf;
  width:min(100%,calc((100vh - 290px)*7/8));width:min(100%,calc((100dvh - 290px)*7/8));min-width:280px;max-width:100%;box-sizing:border-box;touch-action:none;container-type:inline-size}
.case{aspect-ratio:1;border-radius:10px;background:var(--case);position:relative}
.case:nth-child(even){background:var(--case2)}
.case.choisie{box-shadow:inset 0 0 0 3px var(--or)}
.obj{position:absolute;inset:1px;display:grid;place-items:center;font-size:clamp(24px,8.6vw,42px);font-size:calc(100cqw / 7 * .7);line-height:1;cursor:grab;filter:drop-shadow(0 2px 1px rgba(0,0,0,.18))}
.obj .lv{position:absolute;right:1px;bottom:0;font-family:var(--f-titre);font-weight:700;font-size:10px;color:var(--blanc);background:var(--bois);border-radius:5px;padding:1px 3px;filter:none}
.obj.gen{border-radius:10px;background:radial-gradient(circle at 50% 40%,#fff,#ffe1a6);box-shadow:inset 0 0 0 2px var(--or)}
.obj.gen::after{content:"⚡";position:absolute;top:-3px;left:-2px;font-size:10px;background:var(--or);border-radius:50%;width:14px;height:14px;display:grid;place-items:center;filter:none}
.obj.boite{border-radius:9px;background:repeating-linear-gradient(135deg,#d9b380 0 6px,#cfa56e 6px 12px);box-shadow:inset 0 0 0 2px #a8773f;cursor:pointer}
.obj.boite>b{opacity:.45;filter:grayscale(.4);font-weight:400}
.obj.bulle{border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.95),rgba(170,220,255,.55) 45%,rgba(139,108,240,.35));box-shadow:inset 0 0 0 2px rgba(255,255,255,.8);cursor:pointer;animation:flotte 2s ease-in-out infinite}
.obj.source{opacity:.3}
.obj.cible{border-radius:10px;box-shadow:0 0 0 3px var(--vert),0 0 12px rgba(47,179,107,.6)}
.obj.demande-ici{border-radius:10px;box-shadow:inset 0 0 0 2px var(--vert)}
.obj.pop{animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
.obj.tremble{animation:tremble .3s}
@keyframes pop{0%{transform:scale(.3)}100%{transform:scale(1)}}
@keyframes flotte{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes tremble{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.fantome{position:fixed;pointer-events:none;z-index:60;transform:translate(-50%,-75%) scale(1.3);font-size:46px;line-height:1;filter:drop-shadow(0 8px 8px rgba(0,0,0,.35))}

/* Fiche de l'objet */
.fiche{flex:none;display:flex;gap:8px;align-items:center;background:var(--creme);border-radius:14px;padding:5px 8px;box-shadow:0 3px 0 rgba(0,0,0,.18);height:62px;box-sizing:border-box;overflow:hidden}
/* hauteur fixe : le plateau ne bouge plus quand le texte change */
.fiche .txt b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fiche .txt span{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.fiche .gros{font-size:28px;flex:none;width:36px;text-align:center}
.fiche .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.fiche b{font-family:var(--f-titre);font-weight:600;font-size:15px;line-height:1.15}
.fiche span{font-size:12px;font-weight:700;color:var(--doux);line-height:1.25}
.fiche .btn{padding:6px 10px;min-width:0}

/* Boutons / panneaux */
.btn{flex:none;border-radius:12px;padding:8px 12px;font-weight:900;background:var(--or);color:var(--encre);display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:78px;line-height:1.15;box-shadow:0 3px 0 rgba(0,0,0,.18);font-variant-numeric:tabular-nums}
.btn small{font-size:10.5px;font-weight:800;opacity:.8}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn:disabled{background:#e4d8c4;color:var(--doux);box-shadow:none;cursor:default}
.btn.vert{background:var(--vert);color:var(--blanc)}
.btn.violet{background:var(--violet);color:var(--blanc)}
.btn.rouge{background:var(--rouge);color:var(--blanc)}
.btn.sec{background:var(--case2);color:var(--encre)}
.panneau{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;background:var(--creme);border-radius:18px 18px 0 0;padding:4px 12px 14px}
.panneau h2{font-family:var(--f-titre);font-weight:600;font-size:18px;margin:14px 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;color:var(--bois-fonce)}
.panneau h2 small{font-family:var(--f-texte);font-size:12px;color:var(--doux);font-weight:800}
.note{color:var(--doux);font-size:12.5px;font-weight:700;margin:0 0 10px;line-height:1.45}
.liste{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ligne{display:flex;align-items:center;gap:10px;background:var(--blanc);border-radius:14px;padding:9px;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.ligne.fait{opacity:.55}
.ico{flex:none;width:44px;height:44px;display:grid;place-items:center;font-size:26px;background:var(--case);border-radius:12px}
.info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.info b{font-weight:900;font-size:14.5px;line-height:1.2}
.sous{color:var(--doux);font-size:12px;font-weight:700;line-height:1.3}
.barre{height:7px;border-radius:7px;background:var(--case2);overflow:hidden}
.barre i{display:block;height:100%;background:var(--or);border-radius:7px}
.tag{display:inline-block;font-size:10px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;background:var(--rouge);color:var(--blanc);padding:1px 6px;border-radius:6px;margin-left:6px;vertical-align:2px}
.chaine{background:var(--blanc);border-radius:14px;padding:9px;box-shadow:0 2px 0 rgba(0,0,0,.08);display:flex;flex-direction:column;gap:6px}
.chaine .titre{display:flex;justify-content:space-between;align-items:center;font-weight:900;gap:8px}
.chaine .titre span{font-size:12px;color:var(--doux);font-weight:800}
.recettes{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.recettes div{aspect-ratio:1;border-radius:9px;background:var(--case);display:grid;place-items:center;font-size:clamp(18px,5.5vw,26px)}
.recettes div.inconnu{font-size:14px;color:var(--doux);font-weight:900}

/* Onglets */
.onglets{flex:none;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:2px 0 6px}
.onglets button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 0;border-radius:14px;font-size:11.5px;font-weight:900;color:var(--blanc);position:relative;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.onglets button i{font-style:normal;font-size:22px;text-shadow:none}
.onglets button.on{background:rgba(255,255,255,.95);color:var(--bois-fonce);text-shadow:none}
.pastille::after{content:"!";position:absolute;top:0;right:18%;width:16px;height:16px;border-radius:50%;background:var(--rouge);color:var(--blanc);font-size:11px;display:grid;place-items:center}

/* Effets */
.flot{position:fixed;pointer-events:none;font-family:var(--f-titre);font-weight:700;font-size:18px;color:var(--blanc);text-shadow:0 2px 0 rgba(0,0,0,.35),0 0 4px rgba(0,0,0,.25);transform:translate(-50%,-50%);animation:monte 1s ease-out forwards;z-index:30;white-space:nowrap}
@keyframes monte{to{transform:translate(-50%,-180%);opacity:0}}
.vol{position:fixed;pointer-events:none;z-index:35;font-size:22px;transition:left .7s cubic-bezier(.5,0,.8,.6),top .7s cubic-bezier(.3,-.4,.6,1),opacity .2s .6s;transform:translate(-50%,-50%)}
.etincelle{position:fixed;width:7px;height:7px;border-radius:50%;pointer-events:none;z-index:31;animation:eclat .55s ease-out forwards}
@keyframes eclat{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--encre);color:var(--creme);font-weight:800;padding:10px 16px;border-radius:12px;z-index:40;max-width:calc(100vw - 40px);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.banniere{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:45;background:var(--creme);border:3px solid var(--or);border-radius:16px;padding:8px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.3);width:min(340px,calc(100vw - 32px));box-sizing:border-box;animation:tombe .45s cubic-bezier(.2,1.4,.4,1)}
.banniere span{font-size:30px}
.banniere div{display:flex;flex-direction:column;font-weight:900;line-height:1.25}
.banniere small{font-weight:800;color:var(--doux)}
@keyframes tombe{from{transform:translate(-50%,-140%)}}
.voile{position:fixed;inset:0;background:rgba(20,40,60,.6);display:grid;place-items:center;z-index:50;padding:16px}
.boite{background:var(--creme);border-radius:22px;padding:20px;width:min(370px,100%);box-sizing:border-box;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 32px);overflow-y:auto;box-shadow:0 6px 0 rgba(0,0,0,.2)}
.boite h3{font-family:var(--f-titre);font-weight:600;font-size:22px;margin:0;color:var(--bois-fonce);text-align:center;text-wrap:balance}
.boite p{margin:0;line-height:1.5;font-weight:700}
.boite ul{margin:0;padding-left:20px;line-height:1.6;font-weight:700}
.mcorps{display:flex;flex-direction:column;gap:8px}
.mboutons{display:flex;gap:8px;flex-wrap:wrap}
.mboutons .btn{flex:1;padding:12px;min-width:110px}
.grand{font-family:var(--f-titre);font-size:60px;text-align:center;line-height:1.1;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
.recomp{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.recomp span{background:var(--blanc);border-radius:12px;padding:6px 12px;font-weight:900;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.reglage{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--case2);font-weight:800}
.interrupteur{width:52px;height:30px;border-radius:999px;background:var(--case2);position:relative;flex:none}
.interrupteur::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--blanc);transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.interrupteur[aria-checked="true"]{background:var(--vert)}
.interrupteur[aria-checked="true"]::after{left:25px}
.pub{aspect-ratio:16/9;border-radius:14px;background:linear-gradient(135deg,#2f8fcf,#1f4f78);display:grid;place-items:center;text-align:center;font-weight:800;color:#d8ecff;font-size:14px;padding:10px}
.pub b{display:block;font-family:var(--f-titre);font-size:44px;color:var(--blanc)}
.apercu{position:relative;height:150px;border-radius:16px;overflow:hidden;margin-top:6px;background:linear-gradient(180deg,#bfe9ff 0,#e9f8ff 38%,#5fb6e6 38%,#3a9ad6 58%,var(--bois) 58%,#b77a3f 100%)}
img.art{display:block;pointer-events:none;-webkit-user-drag:none;user-select:none}
.obj img.art{width:94%;height:94%}
.obj.gen img.art{width:90%;height:90%}
.obj{filter:none}
.obj.boite>b{display:grid;place-items:center;width:78%;height:78%}.obj.boite>b img.art{width:100%;height:100%}
.caisse-png .obj.boite{background:var(--caisse) center/92% no-repeat;box-shadow:none}
.caisse-png .obj.boite{position:relative}
#decos,.apercu{isolation:isolate}
img.calque{position:absolute;left:0;top:0;width:0;height:0;max-width:none;pointer-events:none;user-select:none}
.chantier .vue img.calque.arrive{transform-origin:50% 100%;z-index:60!important;animation:chArrive .7s 1.5s cubic-bezier(.2,1.5,.4,1) both,chBrille 1.4s 2.2s ease-in-out infinite}
/* l'objet débloqué ressort : le reste du décor s'assombrit et l'objet brille */
.chantier .vue .voile{position:absolute;inset:0;z-index:55;background:rgba(20,12,35,.62);pointer-events:none;animation:chVoile .6s 2.1s both}
@keyframes chVoile{from{opacity:0}to{opacity:1}}
@keyframes chBrille{0%,100%{filter:drop-shadow(0 0 3px #fff) drop-shadow(0 0 10px #ffd84a) brightness(1.08)}50%{filter:drop-shadow(0 0 6px #fff) drop-shadow(0 0 22px #ffb703) brightness(1.25)}}
@keyframes chArrive{0%{opacity:0;transform:translateY(8%) scale(.7);filter:brightness(2.2)}60%{opacity:1;filter:brightness(1.4)}100%{transform:none;filter:none}}
.deco.sol,.deco.eau,.deco.ciel{filter:none}
.deco>img.art{position:relative;z-index:1;display:block}
.deco.sol>img.art{filter:drop-shadow(0 2px 1.5px rgba(40,25,10,.35))}
.deco.sol::after{content:'';position:absolute;left:12%;right:12%;bottom:0;height:14%;border-radius:50%;background:radial-gradient(closest-side,rgba(40,25,10,.38),transparent);z-index:0}
.deco.eau>img.art{animation:flotte 3.2s var(--del,0s) ease-in-out infinite alternate;filter:drop-shadow(0 2px 2px rgba(0,40,80,.3))}
.deco.eau::after{content:'';position:absolute;left:4%;right:4%;bottom:4%;height:16%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.55),rgba(255,255,255,.15) 60%,transparent);animation:vague 3.2s var(--del,0s) ease-in-out infinite alternate;z-index:0}
.deco.ciel>img.art{animation:plane 4.5s var(--del,0s) ease-in-out infinite alternate;filter:drop-shadow(0 4px 4px rgba(30,60,110,.18))}
@keyframes flotte{from{transform:translateY(0) rotate(-1.5deg)}to{transform:translateY(-6%) rotate(1.5deg)}}

@keyframes cfChip{from{opacity:0;transform:scale(0)}to{opacity:1;transform:none}}

@keyframes cfLueurO{0%{transform:scale(.8);opacity:1}40%{transform:scale(1.6);opacity:1}100%{transform:scale(1.3);opacity:.7}}

@keyframes cfFlash{0%{opacity:0;transform:scale(1)}20%{opacity:1}100%{opacity:0;transform:scale(14)}}
@keyframes cfApparait{to{opacity:1}}
@keyframes cfJaillit{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}10%{opacity:1}45%{opacity:1;transform:translate(calc(-50% + var(--dx)*.65),calc(-50% + var(--dy))) scale(1.15) rotate(calc(var(--r)*.5))}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy) + 170px)) scale(.9) rotate(var(--r))}}
@keyframes cfAide{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

@keyframes fxEtoile{0%{transform:translate(-50%,-50%) scale(0);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.1) rotate(200deg);opacity:0}}

@keyframes tlDandine{0%,60%,100%{transform:rotate(0)}68%{transform:rotate(-10deg) scale(1.06)}76%{transform:rotate(9deg) scale(1.06)}84%{transform:rotate(-6deg)}92%{transform:rotate(4deg)}}
.tl-scene{position:relative;height:190px;display:grid;place-items:center}

function produire(i){const v=S.grille[i];const j=caseLibreProche(i);
  if(j<0){toast('Plateau plein : fusionne ou vends des ingrédients');SON.non();tremble(i);return}
  if(!depenserEnergie())return;
  const am=(S.amelio&&S.amelio[v.c])||0,x=Math.random(),c=CHANCES_GEN(am),p2=c[2]+Math.min(.12,S.niveau*.01);
  /* tirage : jackpot (plat au max, appareil au maximum seulement), puis niveaux 5, 4, 3, 2, sinon niveau 1 */
  let l=1,acc=0;const jack=!CH[v.c].event&&x<(acc+=c.jack);
  if(jack)l=NMAX;else if(x<(acc+=c[5]))l=5;else if(x<(acc+=c[4]))l=4;else if(x<(acc+=c[3]))l=3;else if(x<(acc+=p2))l=2;
  if(jack)setTimeout(()=>{SON.niveau();vibrer([40,40,90]);etincelles(j,'#ffd84a');setTimeout(()=>etincelles(j,'#fff'),150);banniere('🍀','Coup de chance !',`Ton appareil a produit directement : ${nomObj(v.c,l)} (niv. ${l})`)},250);
  S.grille[j]=obj(v.c,l);decouvrir(v.c,l);SON.produire();vibrer(6);tutoEvt('produire');quete('produire');
  /* petit vol de l'objet depuis le générateur */
  const[x0,y0]=centre(i),[x1,y1]=centre(j);const f=document.createElement('div');f.className='vol';f.innerHTML=imgObj(v.c,l);f.style.left=x0+'px';f.style.top=y0+'px';document.body.appendChild(f);
  requestAnimationFrame(()=>{f.style.left=x1+'px';f.style.top=y1+'px'});setTimeout(()=>{f.remove()},380);
  calculerDemandes();setTimeout(()=>rendrePlateau(j),MOUV_REDUIT?0:330);majUI()}
function tremble(i){const o=P.children[i].firstChild;if(o){o.classList.remove('tremble');void o.offsetWidth;o.classList.add('tremble')}}
function fusion(i,j){const a=S.grille[i],b=S.grille[j];const l=a.l+1;S.grille[i]=null;S.grille[j]=obj(a.c,l);
  let ouvertes=0;if(b.b)ouvertes++;voisins(j).forEach(k=>{const v=S.grille[k];if(v&&v.k==='it'&&v.b){v.b=false;ouvertes++;setTimeout(()=>etincelles(k,'#d9b380'),50)}});
  decouvrir(a.c,l);SON.fusion(l);if(ouvertes)setTimeout(SON.caisse,120);vibrer(14);etincelles(j);
  if(!enMagie&&Math.random()<.04&&l<NMAX&&l>=3&&!S.grille.some(x=>x&&x.k==='bulle')){const k=caseLibreProche(j);if(k>=0){S.grille[k]={k:'bulle',c:a.c,l,fin:Date.now()+60e3};setTimeout(()=>toast('Une bulle bonus est apparue !'),300)}}
  /* Pièces à chaque fusion : proportionnelles au nombre de combos (fusions enchaînées en moins de 3 s, jusqu'à ×10) */
  const now=Date.now();combo=now-derniereFusion<3000?combo+1:1;derniereFusion=now;
  const mult=Math.min(10,combo),gain=Math.ceil(l*mult/2);gagnerPieces(gain);setTimeout(SON.piece,90);
  quete('fusion');quete('niveau',l);quete('combo',combo);if(ouvertes)quete('caisse',ouvertes);
  S.stats.fusions++;S.stats.comboMax=Math.max(S.stats.comboMax||0,combo);remplirTirelire();
  if(a.c==='foire')gagnerTickets(Math.ceil(l/2),j);
  {const[x,y]=centre(j);flotter(`+${gain} 🪙`,x,y-10);if(combo>=2){const el=document.createElement('div');el.className='combo c'+Math.min(5,mult);if(mult>5)el.style.fontSize=Math.min(34,24+(mult-5))+'px';el.textContent=`Combo ×${mult}`;el.style.left=x+'px';el.style.top=(y-34)+'px';document.body.appendChild(el);setTimeout(()=>el.remove(),900)}}
  choix=j;calculerDemandes();rendrePlateau(j);majFiche();majUI();tutoEvt('fusion')}
let combo=0,derniereFusion=0;
function deplacer(i,j){if(i===j)return;const a=S.grille[i],b=S.grille[j];if(!a)return;
  if(b&&((a.k==='joker'||a.k==='ciseaux')||((b.k==='joker'||b.k==='ciseaux')&&a.k==='it'))){if(utiliserSpecial(i,j))return}
  if(b&&a.k==='it'&&b.k==='it'&&a.c===b.c&&a.l===b.l){if(a.l>=NMAX){if(b.b){tremble(j);SON.non();return}fusionTresor(i,j);return}fusion(i,j);return}
  if(b&&(b.k==='bulle'||(b.k==='it'&&b.b))){tremble(j);SON.non();return}
  S.grille[j]=a;S.grille[i]=b;choix=j;SON.pose();calculerDemandes();rendrePlateau();majFiche()}

const PALIERS=[{t:20,r:{g:10}},{t:60,r:{e:40,reveil:1}},{t:120,r:{g:20,joker:1}},{t:200,r:{p:2000,b:2}},{t:300,r:{g:40},deco:'e1'}];

function eventInfo(){const d=new Date(),j=d.getDay(),actif=j===5||j===6||j===0;const ven=new Date(d);ven.setDate(d.getDate()-(j===0?2:j-5));ven.setHours(0,0,0,0);
  const lun=new Date(ven);lun.setDate(ven.getDate()+3);return{actif,id:jourCle(ven),fin:lun.getTime()}}
function gagnerTickets(n,j){const E=S.event;if(!E||E.fini)return;E.tickets+=n;if(j!==undefined){const[x,y]=centre(j);setTimeout(()=>flotter(`+${n} 🎟️`,x+18,y-26),150)}

/* ================= Fusion magique : tout fusionner d'un coup ================= */
let enMagie=false;
const libreMagie=v=>v&&v.k==='it'&&!v.b&&v.l<NMAX;
function nbFusionsPossibles(){const n={};S.grille.forEach((v,k)=>{if(libreMagie(v)&&!demandesIci.has(k)){n[v.c]=n[v.c]||Array(NMAX+2).fill(0);n[v.c][v.l]++}});
  let t=0;for(const c in n)for(let l=1;l<NMAX;l++){const p=Math.floor(n[c][l]/2);t+=p;n[c][l+1]+=p}return t}
/* baguette illimitée (cadeau de client bonus) : S.magieFin = fin de la période */
const magieIll=()=>(S.magieFin||0)>Date.now();
/* Explication d'un objet spécial la première fois qu'on l'obtient (file d'attente : jamais par-dessus une autre fenêtre) */
const EXPLIC={
  joker:{art:'joker',ico:'🃏',titre:'Le Joker',txt:'Glisse-le sur <b>n’importe quel ingrédient</b> du plateau : l’ingrédient <b>monte d’un niveau</b> tout de suite, sans avoir besoin de son jumeau !',astuce:'Garde-le pour un plat de haut niveau qui te manque pour un client.'},

  reveil:{art:'reveil',ico:'⏰',titre:'Le Réveil',txt:'<b>Touche-le</b> sur le plateau : tu gagnes <b>+30 ⚡ d’énergie</b> tout de suite.',astuce:'Pratique quand ton énergie est vide et que tu veux continuer à jouer.'},
  baguette:{art:'baguette',ico:'🪄',titre:'La Baguette magique',txt:'Appuie sur le bouton violet <b>« Tout fusionner »</b> en bas à droite : <b>tout le plateau fusionne d’un coup</b>, en cascade !',astuce:'Les plats prêts pour tes clients sont protégés. Le chiffre sur le bouton = tes baguettes restantes.'},
  magie10:{art:'baguette',ico:'🪄',titre:'Baguette illimitée',txt:'Pendant <b>10 minutes</b>, le bouton <b>« Tout fusionner »</b> devient doré : utilise-le <b>autant de fois que tu veux</b>, gratuitement !',astuce:'Produis beaucoup d’ingrédients puis fusionne tout : c’est le moment d’avancer très vite.'}};
let fileExplic=[],bagAvant=null;const tutoFini=()=>S.tuto===undefined||S.tuto>=99;
function expliquer(k){if(!EXPLIC[k])return;S.explique=S.explique||{};if(S.explique[k]||fileExplic.includes(k))return;fileExplic.push(k);setTimeout(montrerExplic,900)}
function montrerExplic(){if(!fileExplic.length)return;

function majMagie(){const b=$('#btnMagie'),ill=magieIll();

  if(bagAvant===null)bagAvant=S.baguettes;if(S.baguettes>bagAvant)expliquer('baguette');bagAvant=S.baguettes;$('#nbMagie').textContent=ill?'∞ '+fmtTemps((S.magieFin-Date.now())/1000):S.baguettes>0?S.baguettes:'+';

function lancerMagie(){if(enMagie||(!magieIll()&&S.baguettes<=0))return;if(!magieIll())S.baguettes--;enMagie=true;finDrag();let total=0,vague=0;const p0=S.pieces;
  const etape=()=>{calculerDemandes();const grp={};S.grille.forEach((v,k)=>{if(libreMagie(v)&&!demandesIci.has(k))(grp[v.c+':'+v.l]=grp[v.c+':'+v.l]||[]).push(k)});
    const paires=[];for(const g in grp){const L=grp[g];for(let x=0;x+1<L.length;x+=2)paires.push([L[x],L[x+1]])}

      if(total){SON.niveau();vibrer(80);toast(`🪄 Magique ! ${total} fusion${total>1?'s':''} d'un coup · +${fmt(S.pieces-p0)} 🪙`);const[x,y]=centre(Math.floor(NB/2));flotter(`×${total}`,x,y)}return}
    vague++;

      requestAnimationFrame(()=>requestAnimationFrame(()=>{g.style.left=x1+'px';g.style.top=y1+'px';g.classList.add('arrive')}));
      setTimeout(()=>g.remove(),440)});

    setTimeout(fusionner,420)};
  SON.magie();majMagie();setTimeout(etape,150)}

  if(!drag.moved&&Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)>7){if(v.k==='bulle'||(v.k==='it'&&v.b))return;drag.moved=true;

function toucher(i){const v=S.grille[i];if(!v)return;

/* Amélioration des appareils (5 niveaux) */
const COUT_AMELIO=[800,2000,4500,9000];
function ameliorer(c){S.amelio=S.amelio||{};const am=S.amelio[c]||0,cout=COUT_AMELIO[am];if(cout===undefined||S.pieces<cout)return;
  S.pieces-=cout;S.amelio[c]=am+1;vibrer(40);if(choix>=0)etincelles(choix,'#a66bff');animerAmelio(c,am,am+1);rendrePlateau();majFiche();majUI();sauver()}
/* Animation d'amélioration : l'appareil se charge d'énergie, éclair, il réapparaît dans sa nouvelle forme */
function animerAmelio(c,av,ap){const R=(a,b)=>a+Math.random()*(b-a),g=CH[c];
  const bonus=ap>=4?'Niveau MAX : beaucoup plus d’ingrédients niveau 3 à 5, et parfois 🍀 un plat directement au niveau maximum !':'Meilleurs ingrédients'+descGen(ap).replace(/^ · /,' : ');
  const forme=ap===2&&URL_ART['genlux:'+c]?'<div class="am-forme">✨ Nouvelle forme : version de luxe !</div>':'';
  let parts='';for(let k=0;k<16;k++){const a=k/16*6.283,d=R(110,150);parts+=`<i class="am-part" style="--dx:${Math.cos(a)*d|0}px;--dy:${Math.sin(a)*d|0}px;animation-delay:${R(0,.5).toFixed(2)}s"></i>`}
  const el=document.createElement('div');el.className='fete amelio-fx';

      <div class="am-av obj gen am${av}">${imgGen(c,av)}</div><div class="am-ap obj gen am${ap}">${imgGen(c,ap)}</div><div class="cf-flash"></div></div>
    <div class="am-et">${[1,2,3,4].map(n=>`<b class="${n<=ap?'on':''}${n===ap?' neuf':''}">★</b>`).join('')}</div>
    <div class="fx-nom">${g.gen[1]}</div><div class="fx-sous">Niveau ${av+1} → <b>niveau ${ap+1}</b></div>${forme}<p class="note am-bonus">${bonus}</p><button class="btn vert">Super !</button></div>`;
  document.body.appendChild(el);
  if(S.son){ton(220,{fin:880,dur:1.1,vol:.08,type:'triangle'});setTimeout(()=>{bruit({f:900,fin:200,dur:.2,vol:.16,q:2});SON.niveau()},1150);setTimeout(()=>ton(1320,{dur:.15,vol:.1}),1700)}
  setTimeout(()=>vibrer(60),1150);

  el.querySelector('.btn').onclick=fermer;setTimeout(()=>{el.onclick=e=>{if(e.target===el)fermer()}},1800)}

/* ================= Clients et commandes ================= */
function nouveauClient(){const U=ORDRE.filter(debloquee);const lmax=Math.min(NCMD,2+Math.floor(S.niveau/2));
  /* 3 profils : facile (50 %) = 1 petit plat ; moyen (33 %) = plat du milieu, parfois 2 ; difficile (17 %) = 2 plats dont un proche du max.
     Les niveaux 9-10 sont des chefs-d'œuvre (livre + trésor), jamais commandés. Le prix suit la difficulté. */
  const x=Math.random(),prof=S.niveau<3?'facile':x<.5?'facile':x<.83?'moyen':'difficile',mid=Math.max(3,Math.round((2+lmax)/2)),R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
  const tir=()=>U[Math.floor(Math.random()*U.length)],req=[];
  if(prof==='facile')req.push({c:tir(),l:R(2,Math.min(3,lmax))});
  else if(prof==='moyen'){req.push({c:tir(),l:R(3,Math.min(mid,lmax))});if(Math.random()<.3)req.push({c:tir(),l:R(2,3)})}
  else{req.push({c:tir(),l:R(Math.max(3,lmax-1),lmax)});req.push({c:tir(),l:R(2,mid)})}
  const pris=new Set(S.clients.filter(Boolean).map(x=>x.nom));const libres=CLIENTS.filter(c=>!pris.has(c[1]));const p=libres[Math.floor(Math.random()*libres.length)];
  let pieces=req.reduce((t,r)=>t+Math.round(5*Math.pow(2.1,r.l-1)),0),xp=req.reduce((t,r)=>t+r.l*2,0);
  /* client VIP : pressé (10 min) mais paie ×3 */
  const vip=S.niveau>=3&&Math.random()<.15&&!S.clients.some(c=>c&&c.vip);
  if(vip){pieces*=3;xp*=2}
  /* client bonus : récompense surprise, mais commande plus dure (2 plats, niveau plus élevé) */
  /* dès le niveau 1 ; le tout premier arrive vite (après le 1er client servi) pour montrer qu'il existe */
  /* ~30 % de clients bonus, garanti au moins 1 tous les 4 clients ; jusqu'à 2 en même temps quand il y a 5 tables ou plus */
  S.sansBonus=(S.sansBonus||0)+1;const nbB=S.clients.filter(c=>c&&c.bonus).length,maxB=S.clients.length>=5?2:1;
  if(!vip&&nbB<maxB&&(Math.random()<.3||S.sansBonus>=4||(!S.bonusVu&&(S.servis||0)>=1))){S.sansBonus=0;
    S.bonusVu=1;const b=tirerBonus();req.length=0;
    /* plus dur qu'un client normal mais faisable : un plat entre le milieu et le max, plus un petit plat */
    req.push({c:tir(),l:R(Math.min(mid+1,lmax),lmax)});req.push({c:tir(),l:R(2,Math.min(4,lmax))});
    pieces=req.reduce((t,r)=>t+Math.round(5*Math.pow(2.1,r.l-1)),0);xp=req.reduce((t,r)=>t+r.l*2,0);if(b.k==='jackpot'){b.n=pieces*3;pieces*=4}
    return{av:p[0],nom:p[1],req,pieces,xp,vip:false,fin:0,bonus:b}}
  return{av:p[0],nom:p[1],req,pieces,xp,vip,prof,fin:vip?Date.now()+600e3:0}}
const BONUS=[{k:'gemmes',p:16},{k:'joker',p:10},{k:'ciseaux',p:10},{k:'reveil',p:6},{k:'baguette',p:8},{k:'magie10',p:9},{k:'coffre',p:14},{k:'jackpot',p:7},{k:'mystere',p:22}];

      SON.niveau();vibrer([40,40,80]);if(k==='gros'&&S.son)for(let n=0;n<8;n++)setTimeout(()=>ton(900+n*120,{dur:.1,vol:.09}),n*90);
      if(k==='pieces')gagnerPieces(pie);else if(k==='magie10'){expliquer('magie10');S.magieFin=Math.max(Date.now(),S.magieFin||0)+600e3}else donner(L.rec);sauver()},450)}});
  el.querySelector('.my-btn').onclick=()=>{if(!fini)return;const r=el.querySelector('.my-gain').getBoundingClientRect(),L=LOTS[gagne];
    const cible={gemmes:'#gemmes',gros:'#gemmes',pieces:'#pieces',energie:'#energie',baguette:'#btnMagie',magie10:'#btnMagie'}[gagne];if(cible)volerVers(L.ico==='♾️'?'🪄':L.ico,r.left+r.width/2,r.top,cible,6);

function tirerBonus(){let x=Math.random()*BONUS.reduce((t,b)=>t+b.p,0);const b=BONUS.find(b=>(x-=b.p)<0)||BONUS[0];return{k:b.k,n:b.k==='gemmes'?5+Math.floor(Math.random()*11):1}}
const icoBonus=b=>({gemmes:'💎',joker:pic('joker','🃏',18),ciseaux:pic('ciseaux','🪞',18),reveil:pic('reveil','⏰',18),baguette:pic('baguette','🪄',18),magie10:pic('baguette','🪄',18)+'∞',mystere:'❓',coffre:pic('coffre:1','🧰',20),jackpot:'💰'})[b.k];

/* plus de tables avec le niveau : 3, puis 4 (niv. 4), 5 (niv. 8), 6 (niv. 12) — carrousel qu'on fait glisser */

let correspondances=[];
function calculerDemandes(){demandesIci=new Set();correspondances=S.clients.map(cl=>{if(!cl)return null;const pris=new Set(),res=[];
  for(const r of cl.req){let f=-1;for(let k=0;k<NB;k++){const v=S.grille[k];if(!pris.has(k)&&v&&v.k==='it'&&!v.b&&v.c===r.c&&v.l===r.l){f=k;break}}res.push(f);if(f>=0){pris.add(f);demandesIci.add(f)}}
  return res})}

/* points + flèches du carrousel de clients (vert = un client prêt à servir caché de ce côté) */
function majCarrousel(){const Z=$('#clients'),sc=$('#scene');if(!Z||!sc)return;const n=S.clients.length;
  let pts=$('#clientsPts'),fg=$('#clientsG'),fd=$('#clientsD');
  if(!pts){pts=document.createElement('div');pts.id='clientsPts';pts.className='clients-pts';sc.appendChild(pts);
    fg=document.createElement('button');fg.id='clientsG';fg.className='clients-fleche g';fg.textContent='‹';fg.setAttribute('aria-label','Clients précédents');sc.appendChild(fg);

    Z.addEventListener('scroll',()=>majCarrousel(),{passive:true})}
  const w=Z.children[0]?Z.children[0].offsetWidth+6:1,deb=Math.round(Z.scrollLeft/w),vis=3;

  im.style.left=(x/100*dw-(dw-W)/2)+'px';im.style.top=(y/100*dh-(dh-H)/2)+'px';im.style.width=(w/100*dw)+'px';im.style.height=(h/100*dh)+'px';im.dataset.ok=1})}

  el.innerHTML=`<div class="fx-carte"><div class="fx-titre">Tirelire cassée !</div><div class="tl-scene"><div class="fx-rayons"></div>

    const b=el.querySelector('.tl-total b'),t0=performance.now();const pas=t=>{const f=Math.min(1,(t-t0)/900);b.textContent=Math.round(n*f*(2-f));if(f<1)requestAnimationFrame(pas)};requestAnimationFrame(pas)},1750);
  let fini=false;const fermer=()=>{if(fini)return;fini=true;const r=el.querySelector('.tl-total').getBoundingClientRect();volerVers('💎',r.left+r.width/2,r.top+r.height/2,'#gemmes',10);SON.achat();
    el.classList.add('sort');setTimeout(()=>{el.remove();majUI()},320)};
  el.querySelector('.btn').onclick=fermer;setTimeout(()=>{el.onclick=e=>{if(e.target===el)fermer()}},2600)}
function pubsRestantes(){const d=new Date().toDateString();if(S.jourPub!==d){S.jourPub=d;S.pubsJour=0}return 6-S.pubsJour}

/* ================= Bonus de connexion (7 jours) + quêtes du jour ================= */
const jourCle=d=>{d=d||new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const CALENDRIER=[{p:100},{e:30},{g:5},{b:1},{p:300},{e:50},{g:25,b:2}];
const txtRec=r=>[r.p?`+${fmt(r.p)} 🪙`:'',r.e?`+${r.e} ⚡`:'',r.g?`+${r.g} 💎`:'',r.b?`+${r.b} 🪄`:'',r.joker?`+${r.joker} 🃏`:'',r.ciseaux?`+${r.ciseaux} 🪞`:'',r.reveil?`+${r.reveil} ⏰`:''].filter(Boolean).join(' ');
const icoRec=r=>r.b&&r.g?'🎁':r.b?'🪄':r.g?'💎':r.e?'⚡':'🪙';
function donner(r){if(r.p)S.pieces+=r.p;if(r.e)S.energie+=r.e;if(r.g)S.gemmes+=r.g;if(r.b)S.baguettes+=r.b;['joker','ciseaux','reveil'].forEach(k=>{for(let n=0;n<(r[k]||0);n++)donnerObjet(k)})}
const QUETES=[
  {type:'produire',ico:'🧺',n:()=>25+S.niveau*3,txt:n=>`Produis ${n} ingrédients`},
  {type:'fusion',ico:'✨',n:()=>15+S.niveau*2,txt:n=>`Fais ${n} fusions`},
  {type:'servir',ico:'🍽️',n:()=>4+Math.floor(S.niveau/2),txt:n=>`Sers ${n} clients`},
  {type:'pieces',ico:'🪙',n:()=>200+S.niveau*80,txt:n=>`Gagne ${fmt(n)} pièces`},
  {type:'niveau',ico:'⭐',max:true,n:()=>Math.min(NMAX,3+Math.floor(S.niveau/3)),txt:n=>`Crée un plat de niveau ${n}`},
  {type:'caisse',ico:'📦',art:'boite',n:()=>3,ok:()=>S.grille.filter(v=>v&&v.b).length>=4,txt:n=>`Ouvre ${n} caisses`},
  {type:'combo',ico:'🔥',max:true,n:()=>5,txt:n=>`Atteins un combo ×${n}`}];
function nouvellesQuetes(){const dispo=QUETES.filter(q=>!q.ok||q.ok()).sort(()=>Math.random()-.5).slice(0,3);
  const recs=[{p:120+S.niveau*30},{e:15,reveil:1},{g:4,joker:1}].sort(()=>Math.random()-.5);
  S.quetes={jour:jourCle(),coffre:false,liste:dispo.map((q,i)=>({type:q.type,obj:q.n(),prog:0,rec:recs[i],pris:false}))}}
/* appelé à chaque action : avance les quêtes */
function quete(type,n){
  /* compteurs cumulés (missions du parcours) */
  S.cumul=S.cumul||{};if(type==='niveau'){for(let k=1;k<=n;k++)S.cumul['niv'+k]=(S.cumul['niv'+k]||0)+1}else S.cumul[type]=(S.cumul[type]||0)+(type==='pieces'||type==='caisse'?(n||0):1);
  if(!S.quetes)return;let chg=false;S.quetes.liste.forEach(q=>{if(q.type!==type||q.pris||q.prog>=q.obj)return;const def=QUETES.find(x=>x.type===type);
  const av=q.prog;q.prog=def.max?Math.max(q.prog,n||0):q.prog+(n===undefined?1:n);if(q.prog>=q.obj&&av<q.obj){q.prog=q.obj;setTimeout(()=>{toast(`📋 Quête réussie : ${def.txt(q.obj)} !`);SON.achat()},400)}chg=true});if(chg)cle=onglet==='quetes'?'':cle}
function reclamerQuete(i){const q=S.quetes&&S.quetes.liste[i];if(!q||q.pris||q.prog<q.obj)return;q.pris=true;donner(q.rec);SON.servir();
  const def=QUETES.find(x=>x.type===q.type)||{ico:'📋',txt:()=>''};celebrer({titre:'Quête réussie !',ico:def.art?pic(def.art,def.ico,64):def.ico,nom:def.txt(q.obj),rec:q.rec,petit:true});sauver();cle='';majUI()}
function reclamerCoffreJour(){const Q=S.quetes;if(!Q||Q.coffre||!Q.liste.every(q=>q.pris))return;Q.coffre=true;const r={g:15,b:1,p:200+S.niveau*50,ciseaux:1};donner(r);SON.niveau();
  ouvrirCoffre({titre:'Coffre du jour !',rec:r,note:'Nouvelles quêtes demain !'});sauver();cle='';majUI()}
/* semaine 1 ×1, semaine 2 ×1,5, semaine 3 ×2 … jusqu'à ×3 */
const multSemaine=()=>Math.min(3,1+.5*((S.connexion.semaine||1)-1));
function recJour(n){const m=multSemaine(),r=CALENDRIER[n-1],o={};for(const k in r)o[k]=k==='b'?Math.max(r[k],Math.round(r[k]*m)):Math.round(r[k]*m);return o}
const rareSuivante=()=>RARES.find(x=>!S.decos[x.id]);
function reclamerConnexion(){const C=S.connexion;if(!C||C.reclame)return;C.reclame=true;const r=recJour(C.serie);donner(r);SON.servir();setTimeout(SON.niveau,250);vibrer(40);
  toast(`Jour ${C.serie} : ${txtRec(r)}`);
  if(C.serie===7){const d=rareSuivante();
    if(d){S.decos[d.id]=1;dernierDeco=d.id;rendreDecos();setTimeout(()=>{SON.decouverte();modale('Semaine complète ! 🏆',`<div class="grand">${imgDeco(d,120)}</div><p style="text-align:center">Pour te remercier de ta fidélité, voici une décoration rare :<br><b>${d.nom}</b> !<br>Elle est installée sur le port.</p><p class="note" style="text-align:center;margin:0">La semaine prochaine, les cadeaux seront encore plus gros (×${Math.min(3,multSemaine()+.5).toLocaleString('fr-FR')}).</p>`,[{txt:'Merci !',cls:'vert'}])},700)}
    else{S.gemmes+=50;setTimeout(()=>toast('Semaine complète : +50 💎 bonus !'),900)}}
  sauver();cle='';majUI()}
function htmlCalendrier(){const C=S.connexion,m=multSemaine(),d=rareSuivante();return`<p class="note" style="text-align:center;margin:4px 0 0"><b>Semaine ${C.semaine||1}</b> · cadeaux ×${m.toLocaleString('fr-FR')}${m<3?' (ils grossissent chaque semaine)':' (maximum !)'}</p><div class="calendrier">${CALENDRIER.map((x,i)=>{const n=i+1,r=recJour(n),pris=n<C.serie||(n===C.serie&&C.reclame),auj=n===C.serie&&!C.reclame;
  return`<div class="jour${pris?' pris':''}${auj?' auj':''}${n===7?' sept':''}"><b>Jour ${n}</b><i>${icoRec(r)}</i>${txtRec(r).replace(/ \+/g,'<br>+')}${n===7?(d?`<br>+ ${imgDeco(d,22)}`:'<br>+50 💎'):''}</div>`}).join('')}</div>`}
/* nouveau jour : série de connexion (+1 si hier, sinon on recommence) et nouvelles quêtes */
function verifierJour(){const auj=jourCle();
  if(!S.connexion||S.connexion.jour!==auj){const hier=jourCle(new Date(Date.now()-864e5));const C=S.connexion;
    const suite=C&&C.jour===hier&&C.reclame,serie=suite?C.serie%7+1:1;
    /* série continue : semaine +1 après le jour 7 ; jour raté : retour au jour 1 (on garde la semaine atteinte) */
    const semaine=(C&&C.semaine||1)+(suite&&C.serie===7?1:0);S.connexion={jour:auj,serie,reclame:false,semaine};
    if(S.tutoFait)setTimeout(()=>{if(!$('#modale').hidden||S.connexion.reclame)return;SON.achat();
      modale(`Bonus du jour ${S.connexion.serie} / 7`,`<p style="text-align:center;margin:0 0 4px">Reviens chaque jour : les cadeaux grossissent !<br>Jour 7 = une <b>décoration rare</b> pour le port.</p>${htmlCalendrier()}<p class="note" style="text-align:center;margin:4px 0 0">Si tu rates un jour, la série recommence au jour 1.</p>`,[{txt:'Récupérer !',cls:'vert',fn:reclamerConnexion}])},1200)}
  if(!S.quetes||S.quetes.jour!==auj)nouvellesQuetes()}

/* Succès à paliers : chaque succès a des niveaux I, II, III… ; après la liste, l'objectif double à l'infini */
const SUCCES_DEF=[

   Calcule les prochains rappels quand le joueur quitte le jeu. Dans l'appli Android,
   window.RappelsAndroid.planifier(json) les programme en notifications locales (Capacitor). */
function planifierRappels(){const liste=[];const now=Date.now();
  if(S.rappels!==false){majEnergie();
    if(S.energie<E_MAX){const t=now+(E_MAX-S.energie-1)*E_REGEN+(E_REGEN-(now-S.energieT));liste.push({id:1,quand:t,titre:'Cuisine du Port',texte:'⚡ Ton énergie est pleine : les clients t’attendent !'})}
    const demain=new Date();demain.setDate(demain.getDate()+1);demain.setHours(10,0,0,0);liste.push({id:2,quand:demain.getTime(),titre:'Cuisine du Port',texte:'🎁 Ton cadeau du jour est prêt, ne casse pas ta série !'});
    const cadeau=S.cadeauT+4*3600e3;if(cadeau>now)liste.push({id:3,quand:cadeau,titre:'Cuisine du Port',texte:'🎁 Un cadeau gratuit t’attend dans la boutique !'})}
  try{if(window.RappelsAndroid&&window.RappelsAndroid.planifier)window.RappelsAndroid.planifier(JSON.stringify(liste))}catch(e){}
  return liste}

   étapes : 0 produire · 1 fusionner · 2 servir · 3 aller dans Rénover · 4 acheter une déco · 99 fini */
const TUTO_FIN=99;let tutoEl=null,tutoBulle=null,tutoCle='';
function tutoEvt(e){if(S.tuto===undefined||S.tuto>=TUTO_FIN)return;const avant=S.tuto;
  if(e==='produire'&&S.tuto===0)S.tuto=1;
  else if(e==='fusion'&&S.tuto<=1)S.tuto=2;
  else if(e==='servir'&&S.tuto<=2)S.tuto=3;
  else if(e==='resto'&&S.tuto===3)S.tuto=4;
  else if(e==='deco'&&S.tuto>=3){S.tuto=TUTO_FIN;setTimeout(()=>{SON.niveau();toast('Tutoriel terminé ! Bon appétit, chef 👨‍🍳')},600);setTimeout(proposerOffre,4000)}
  if(S.tuto!==avant){sauver();majTuto()}}
function cacherTuto(){if(tutoEl)tutoEl.hidden=true;if(tutoBulle)tutoBulle.hidden=true;tutoCle=''}
function majTuto(){
  if(S.tuto===undefined||S.tuto>=TUTO_FIN||!$('#modale').hidden||enMagie||drag&&drag.moved){cacherTuto();return}
  if(!tutoEl){tutoEl=document.createElement('div');tutoEl.className='tuto-main';tutoEl.innerHTML=`<div class="obj-fantome"></div>${URL_ART.main?`<img src="${URL_ART.main}" alt="">`:'<span style="font-size:44px">👆</span>'}`;document.body.appendChild(tutoEl);
    tutoBulle=document.createElement('div');tutoBulle.className='tuto-bulle';document.body.appendChild(tutoBulle)}
  let mode='',cible=null,cible2=null,txt='',sous='',bulleHaut=true;const caseEl=i=>P.children[i];
  const st=S.tuto;
  if(st<=1&&onglet==='cuisine'){
    let paire=null;if(st===1){const vu={};for(let k=0;k<NB;k++){const v=S.grille[k];if(!v||v.k!=='it'||v.b||v.l>=NMAX)continue;const c=v.c+':'+v.l;if(vu[c]!==undefined){paire=[vu[c],k];break}vu[c]=k}}
    if(paire){mode='glisse';cible=caseEl(paire[0]);cible2=caseEl(paire[1]);txt='Glisse un ingrédient sur son jumeau pour les fusionner !';sous='2 identiques = 1 plat encore meilleur';}
    else{const g=S.grille.findIndex(v=>v&&v.k==='gen');if(g>=0){mode='tape';cible=caseEl(g);txt=st===0?'Touche le panier pour produire un ingrédient !':'Touche encore le panier !';sous='Chaque production coûte 1 ⚡'}}
  }else if(st===2&&onglet==='cuisine'){
    const pret=document.querySelector('.client.pret');
    if(pret){mode='tape';cible=pret;txt='Ce client a tout ce qu’il veut : touche sa carte pour le servir !';bulleHaut=false}
    else{const c=document.querySelector('.client:not(.vide) .demandes');if(c){mode='montre';cible=c;txt='Regarde ce que veulent les clients et prépare-le !';sous='Produis et fusionne jusqu’à avoir le bon plat (✓)';bulleHaut=false}}
  }else if(st===3&&S.pieces>=TRAVAUX[0].cout&&onglet!=='resto'){mode='tape';cible=document.querySelector('[data-onglet="resto"]');txt='Tu as assez de pièces : va décorer le port !';bulleHaut=false}
  else if(st===4){if(onglet==='resto'){const b=$('#tr_'+TRAVAUX[0].id);if(b&&!b.disabled){mode='tape';cible=b;txt=`Achète le ${TRAVAUX[0].nom.toLowerCase()} pour embellir le port !`;bulleHaut=false}}
    else{mode='tape';cible=document.querySelector('[data-onglet="resto"]');txt='Va dans Rénover pour décorer le port !';bulleHaut=false}}
  if(!mode||!cible){cacherTuto();return}
  const r=cible.getBoundingClientRect(),T=58,x=r.left+r.width/2,y=r.top+r.height/2;
  let dx=0,dy=0;if(cible2){const r2=cible2.getBoundingClientRect();dx=r2.left+r2.width/2-x;dy=r2.top+r2.height/2-y}
  const cle=[mode,Math.round(x),Math.round(y),Math.round(dx),Math.round(dy),txt].join('|');
  tutoEl.hidden=false;tutoBulle.hidden=false;if(cle===tutoCle)return;tutoCle=cle;
  tutoEl.className='tuto-main';void tutoEl.offsetWidth;tutoEl.classList.add(mode);
  tutoEl.style.left=(x-T*.38)+'px';tutoEl.style.top=(y-T*.08)+'px';tutoEl.style.setProperty('--dx',dx+'px');tutoEl.style.setProperty('--dy',dy+'px');
  const f=tutoEl.querySelector('.obj-fantome');f.innerHTML=mode==='glisse'?cible.innerHTML.replace(/class="lv"[^<]*<\/span>/,''):'';
  tutoBulle.innerHTML=txt+(sous?`<small>${sous}</small>`:'');
  const pr=P.getBoundingClientRect(),ong=$('#onglets').getBoundingClientRect();
  if(bulleHaut&&onglet==='cuisine'){tutoBulle.style.top=(pr.top+6)+'px';tutoBulle.style.bottom=''}else{tutoBulle.style.top='';tutoBulle.style.bottom=(innerHeight-ong.top+8)+'px'}}

    h+=`<div class="tirelire-boite${tl>=TIRELIRE_MIN?' prete':''}"><span class="ico">${URL_ART.tirelire?`<img class="art" src="${URL_ART.tirelire}" alt="Tirelire">`:'🐷'}</span><div style="flex:1"><b style="font-family:var(--f-titre);font-size:17px">Tirelire du chef</b><br><span class="sous" style="font-size:12px;font-weight:800">+1 💎 à chaque fusion · ${tl} / ${TIRELIRE_MAX} 💎</span><div class="barre" style="margin-top:4px"><i style="width:${tl/TIRELIRE_MAX*100}%;background:#ff7aa8"></i></div><span class="note">${tl<TIRELIRE_MIN?`Cassable à partir de ${TIRELIRE_MIN} 💎`:'Prête à être cassée !'}</span></div><button class="btn vert" data-offre="tirelire" ${tl<TIRELIRE_MIN?'disabled':''}>Casser<small>2,99 €</small></button></div>
      <h2 style="margin-top:12px">Objets spéciaux</h2><ul class="liste">
      ${Object.entries(SPECIAUX).map(([k,s])=>`<li class="ligne"><span class="ico">${URL_ART[k]?`<img class="art" src="${URL_ART[k]}" alt="" style="width:34px;height:34px">`:s.ico}</span><div class="info"><b>${s.nom}</b><span class="sous">${s.aide}</span></div><button class="btn violet" data-special="${k}" id="sp_${k}">${PRIX_SPECIAL[k]} 💎</button></li>`).join('')}</ul>`;
    h+=`<h2>Gratuit</h2><ul class="liste">
      <li class="ligne"><span class="ico">${pic('cadeau','🎁',34)}</span><div class="info"><b>Cadeau gratuit</b><span class="sous" id="cadeauEtat"></span></div><button class="btn vert" data-cadeau="1" id="cadeauBtn">Ouvrir</button></li>
      <li class="ligne"><span class="ico">📺</span><div class="info"><b>Regarder une pub</b><span class="sous" id="pubEtat"></span></div><button class="btn" data-pub="1" id="pubBtn">+25 ⚡</button></li></ul>
      <h2>Énergie</h2><ul class="liste">
      <li class="ligne"><span class="ico">⚡</span><div class="info"><b>Recharge</b><span class="sous">+100 énergie</span></div><button class="btn violet" data-energie="100" id="e100">20 💎</button></li>
      <li class="ligne"><span class="ico">♾️</span><div class="info"><b>Énergie illimitée</b><span class="sous">Produis sans compter pendant 30 min</span></div><button class="btn violet" data-illimite="1" id="eInf">45 💎</button></li></ul>
      <h2>Baguettes magiques <small id="stockBag"></small></h2><ul class="liste">
      <li class="ligne"><span class="ico">${pic('baguette','🪄',34)}</span><div class="info"><b>1 baguette</b><span class="sous">Fusionne tout le plateau d'un coup</span></div><button class="btn violet" data-baguette="1" id="bag1">10 💎</button></li>
      <li class="ligne"><span class="ico">✨</span><div class="info"><b>5 baguettes</b><span class="sous">−20 % par rapport à l'unité</span></div><button class="btn violet" data-baguette="5" id="bag5">40 💎</button></li></ul>
      <h2>Gemmes et packs</h2><ul class="liste">`;
    IAP.filter(p=>!p.cache).forEach(p=>{const fait=p.unique&&S.achats[p.id];h+=`<li class="ligne"><span class="ico">${p.art?pic(p.art,p.ico,34):p.ico}</span><div class="info"><b>${p.nom}${p.tag&&!fait?`<span class="tag">${p.tag}</span>`:''}</b><span class="sous">${p.desc}</span></div><button class="btn vert" data-iap="${p.id}" ${fait?'disabled':''}>${fait?'Acheté':p.prix}</button></li>`});
    h+=`</ul><p class="note" style="margin-top:10px">Version de test : achats et pubs simulés, rien n'est payé.</p>`;
    Pn.innerHTML=h;
    majPanneau=()=>{const reste=S.cadeauT+4*3600e3-Date.now();$('#cadeauEtat').textContent=reste>0?`Prochain dans ${fmtTemps(reste/1000)}`:'Disponible !';$('#cadeauBtn').disabled=reste>0;
      const pr=pubsRestantes();$('#pubEtat').textContent=pr>0?`Encore ${pr} aujourd'hui`:'Reviens demain';$('#pubBtn').disabled=pr<=0;
      $('#e100').disabled=S.gemmes<20;$('#eInf').disabled=S.gemmes<45;
      const ot=$('#offreTemps');if(ot)ot.textContent='Plus que '+fmtTemps((S.installe+OFFRE_DUREE-Date.now())/1000);
      Object.keys(SPECIAUX).forEach(k=>{const b=$('#sp_'+k);if(b)b.disabled=S.gemmes<PRIX_SPECIAL[k]});
      $('#bag1').disabled=S.gemmes<10;$('#bag5').disabled=S.gemmes<40;$('#stockBag').textContent=`tu en as ${S.baguettes}`};
  }
}

function majUI(){
  majEnergie();const now=Date.now();
  $('#niv').textContent=S.niveau;$('#btnNiveau').style.setProperty('--xp',Math.min(100,S.xp/xpPour(S.niveau)*100)+'%');
  $('#energie').textContent=illimite()?'∞':S.energie;
  $('#energieT').textContent=illimite()?fmtTemps((S.illimiteFin-now)/1000):S.energie>=E_MAX?'pleine':'+1 · '+fmtTemps((E_REGEN-(now-S.energieT))/1000);
  $('#pieces').textContent=fmt(S.pieces);$('#gemmes').textContent=S.gemmes;
  rendreClients();majMagie();majTuto();const pret=majMission();
  const pas=(id,on)=>document.querySelector(`[data-onglet="${id}"]`).classList.toggle('pastille',onglet!==id&&on);
  pas('resto',pret);
  pas('boutique',now>=S.cadeauT+4*3600e3);
  verifierJour();verifierEvent();annoncerSucces();pas('quetes',aReclamer());
  if(onglet!=='cuisine'){const k=onglet+cleStructure();if(k!==cle){cle=k;construire()}majPanneau()}
}
/* Bandeau de la mission en cours, au-dessus des clients ; renvoie true si l'étape peut être validée tout de suite */
function majMission(){let el=$('#mission');const sc=$('#scene');if(!sc)return false;
  if(!el){el=document.createElement('button');el.id='mission';el.className='mission-bandeau';sc.appendChild(el);
    el.onclick=()=>{const c=etapeActuelle(),e=ETAPES[c];if(!e)return;
      if((e.k==='defi'&&defiFini(e))||e.k==='coffre'||(e.k==='trav'&&S.pieces>=e.t.cout&&onglet==='resto'))actionEtape(c);
      else if(e.k==='trav'&&S.pieces>=e.t.cout)changerOnglet('resto');
      else if(e.k==='trav')toast(`Encore ${fmt(e.t.cout-S.pieces)} 🪙 pour : ${e.t.nom}`);else actionEtape(c)}}
  const c=etapeActuelle(),e=ETAPES[c];if(!e){el.hidden=true;return false}el.hidden=false;
  let h,pret=false,pc=0;
  if(e.k==='defi'){pret=defiFini(e);pc=fracDefi(e);
    const lab=e.parts.length===1?txtDefi(e):e.parts.map((p,i)=>`${progPart(e,i)>=p.obj?'✅':icoPart(p)}${fmt(progPart(e,i))}/${fmt(p.obj)}`).join(' · ');
    h=pret?`✅ <span>${e.parts.length===1?txtDefi(e):'Mission réussie'}</span><b class="mb-ok">Récupérer !</b>`:`${icoDefi(e)} <span>${lab}</span><b>${etatDefi(e)}</b>`}
  else if(e.k==='trav'){pret=S.pieces>=e.t.cout;pc=Math.min(1,S.pieces/e.t.cout);h=`🔨 <span>${e.t.nom}</span><b class="${pret?'mb-ok':''}">${pret?'Rénover !':fmt(e.t.cout)+' 🪙'}</b>`}
  else{pret=true;pc=1;h=`🧰 <span>Coffre du lieu</span><b class="mb-ok">Ouvrir !</b>`}
  h=`<i class="mb-barre" style="width:${Math.round(pc*100)}%"></i>`+h;
  if(el.innerHTML!==h)el.innerHTML=h;el.classList.toggle('pret',pret);return pret}
function changerOnglet(o){onglet=o;document.querySelectorAll('[data-onglet]').forEach(x=>x.classList.toggle('on',x.dataset.onglet===o));
  $('#vueCuisine').hidden=o!=='cuisine';$('#panneau').hidden=o==='cuisine';$('#panneau').scrollTop=0;cle='';finDrag();majUI();if(o==='resto')tutoEvt('resto')}

/* ================= Démarrage ================= */
function start(data){
  const repris=!!(data&&data.S);S=repris?data.S:(charger()||neuf());
  if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(()=>({S}));
  S.clients=S.clients.map(c=>c||null);if(S.clients.some(c=>!c))S.clients=S.clients.filter(Boolean);remplirClients();
  for(let i=0;i<NB;i++){const v=S.grille[i];if(v&&v.k==='it'&&!v.b)S.vus[v.c+':'+v.l]=1}
  verifierGammes(true);
  construirePlateau();calculerDemandes();rendrePlateau();rendreDecos();majFiche();

  $('#clients').addEventListener('click',e=>{const b=e.target.closest('[data-client]');if(b)servir(+b.dataset.client)});
  $('#onglets').addEventListener('click',e=>{const b=e.target.closest('[data-onglet]');if(b)changerOnglet(b.dataset.onglet)});
  $('#panneau').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;
    if(d.carte)ouvrirCarte();else if(d.succes)reclamerSucces(d.succes);else if(d.special)acheterSpecial(d.special);else if(d.offre)acheterIAP(d.offre);
    else if(d.connexion)reclamerConnexion();else if(d.quete)reclamerQuete(+d.quete);else if(d.coffre)reclamerCoffreJour();
    else if(d.zone!==undefined){zoneVue=+d.zone;cle=''}
    else if(d.etape!==undefined)actionEtape(+d.etape);else if(d.travail)acheterTravail(d.travail);else if(d.iap)acheterIAP(d.iap);else if(d.cadeau)cadeauGratuit();
    else if(d.pub)pub('+25 énergie',()=>{S.energie+=25;toast('+25 ⚡')});
    else if(d.energie){if(S.gemmes>=20){S.gemmes-=20;S.energie+=100;SON.achat();toast('+100 ⚡');sauver()}}
    else if(d.baguette){const n=+d.baguette,prix=n===5?40:10;if(S.gemmes>=prix){S.gemmes-=prix;S.baguettes+=n;SON.achat();toast(`+${n} 🪄`);sauver()}}
    else if(d.illimite){if(S.gemmes>=45){S.gemmes-=45;S.illimiteFin=Math.max(Date.now(),S.illimiteFin)+1800e3;SON.achat();toast('Énergie illimitée pendant 30 min !');sauver()}}
    majUI()});
  $('#btnEnergie').onclick=modaleEnergie;
  $('#btnMagie').onclick=demanderMagie;
  $('#btnGemmes').onclick=()=>changerOnglet('boutique');
  $('#btnReglages').onclick=reglages;
  $('#btnNiveau').onclick=()=>modale(`Niveau ${S.niveau}`,`<p style="text-align:center">Expérience : <b>${S.xp} / ${xpPour(S.niveau)} ⭐</b></p><div class="barre"><i style="width:${S.xp/xpPour(S.niveau)*100}%"></i></div><p class="note" style="text-align:center;margin:0">Sers des clients et rénove le port pour gagner des étoiles. Prochain appareil : ${(ORDRE.map(c=>CH[c]).find(C=>C.deb>S.niveau)||{nom:'tout est débloqué'}).nom}${(ORDRE.map(c=>CH[c]).find(C=>C.deb>S.niveau))?' au niveau '+ORDRE.map(c=>CH[c]).find(C=>C.deb>S.niveau).deb:''}.</p>`,[{txt:'OK',cls:'vert'}]);

  if(S.tuto===undefined)S.tuto=S.tutoFait?TUTO_FIN:0;
  if(!repris&&!S.tutoFait){const chef=URL_ART['client:7']?`<img class="art" src="${URL_ART['client:7']}" alt="Chef Inès">`:'👩‍🍳';
    modale('Bienvenue au port !',`<div class="grand">${chef}</div><p style="text-align:center">Je suis <b>Chef Inès</b>. Le petit restaurant du port a besoin de toi !<br>Suis ma main, je te montre tout. 👇</p>`,[{txt:"C'est parti !",cls:'vert',fn:()=>{S.tutoFait=true;sauver();majTuto()}}])}

  setInterval(()=>{majUI();placerEnAttente();placerObjetsAttente();
    S.clients.forEach((cl,i)=>{if(cl&&cl.vip&&Date.now()>cl.fin){S.clients[i]=nouveauClient();S.clients[i].vip=false;calculerDemandes();toast(`${cl.nom} (VIP) est reparti, trop pressé…`)}});
    let chg=false;for(let i=0;i<NB;i++){const v=S.grille[i];if(v&&v.k==='bulle'&&Date.now()>v.fin){S.grille[i]=null;chg=true}}if(chg){rendrePlateau();majFiche()}},250);
  setInterval(sauver,5000);document.addEventListener('visibilitychange',()=>{if(document.hidden)sauver()});
  majUI();
}
const h=window.claude&&window.claude.hot;
if(h&&h.ready)h.ready(start);else start((h&&h.data)||{});
})();
</script>
