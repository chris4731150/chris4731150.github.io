<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<title>Néon Flipper</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--fond:#05010d;--cyan:#19e6ff;--rose:#ff3df0;--jaune:#ffe94d;--vert:#3dff8a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--fond);color:#fff;font-family:Orbitron,system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#hud{position:fixed;left:0;right:0;top:0;height:70px;padding-top:env(safe-area-inset-top);display:flex;align-items:center;justify-content:center;gap:10px;background:linear-gradient(#0b0218,#05010d);border-bottom:1px solid #ff3df033;z-index:2}
#dmdBox{height:58px;aspect-ratio:4/1;border-radius:8px;padding:3px;background:#100307;box-shadow:0 0 0 2px #2a0b20,0 0 18px #ff7a1a33 inset}
#dmd{width:100%;height:100%;display:block}
#son{position:absolute;right:10px;background:none;border:1.5px solid var(--rose);color:var(--rose);border-radius:10px;font:inherit;font-size:14px;width:34px;height:30px}
#jeu{position:fixed;left:0;right:0;top:70px;bottom:0}
#jeu canvas{display:block;width:100%;height:100%}
.pop{position:absolute;pointer-events:none;font-weight:900;font-size:15px;transform:translate(-50%,-50%);animation:monte 1s ease-out forwards;white-space:nowrap}
@keyframes monte{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-46px}}
.ecran{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px 16px;background:radial-gradient(circle at 50% 40%,#2a0b4ab0,#05010de8 70%);z-index:5}
.ecran[hidden]{display:none}
.titre{font-size:clamp(40px,13vw,72px);font-weight:900;line-height:1;color:#fff;text-shadow:0 0 6px var(--rose),0 0 18px var(--rose),0 0 40px var(--rose)}
.titre span{display:block;text-shadow:0 0 6px var(--cyan),0 0 18px var(--cyan),0 0 40px var(--cyan)}
.ecran p{margin:0;max-width:350px;font-family:system-ui,sans-serif;font-size:15px;line-height:1.5;color:#e2d4ff}
.ecran .rec{font-size:15px;color:var(--jaune);text-shadow:0 0 8px var(--jaune)}
.btn{font:inherit;font-weight:900;font-size:22px;letter-spacing:2px;color:#fff;background:none;border:3px solid var(--cyan);border-radius:18px;padding:14px 46px;box-shadow:0 0 14px var(--cyan),inset 0 0 14px var(--cyan);text-shadow:0 0 10px var(--cyan);animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 26px var(--cyan),inset 0 0 20px var(--cyan)}}
.big{font-size:42px;font-weight:900;text-shadow:0 0 12px var(--cyan)}
#charge{position:fixed;right:6px;bottom:20px;width:8px;height:0;background:var(--jaune);box-shadow:0 0 12px var(--jaune);border-radius:4px;z-index:3}
#erreur{position:fixed;inset:auto 10px 10px 10px;color:#f88;font:12px monospace;z-index:9}
</style>
</head>
<body>
<div id="hud"><div id="dmdBox"><canvas id="dmd"></canvas></div><button id="son" aria-label="Musique">♪</button></div>
<div id="jeu"></div>
<div id="charge"></div>
<div class="ecran" id="menu">
  <div class="titre">NÉON<span>FLIPPER</span></div>
  <p>Touche la <b>gauche</b> ou la <b>droite</b> de l'écran pour les palettes. Pour lancer : <b>maintiens à droite</b>, puis relâche.</p>
  <p>🎯 Rampes, orbite et spinner · 3 cibles orange = <b>LOCK</b> sur la rampe gauche · 2 billes bloquées = <b>MULTIBALL</b> · N‑E‑O‑N = multiplicateur · missions et combos</p>
  <div class="rec" id="recMenu"></div>
  <button class="btn" id="jouer">JOUER</button>
</div>
<div class="ecran" id="fin" hidden>
  <div class="titre" style="font-size:clamp(34px,10vw,56px)">PARTIE<span>TERMINÉE</span></div>
  <div class="big" id="scoreFin">0</div>
  <div class="rec" id="recFin"></div>
  <button class="btn" id="rejouer">REJOUER</button>
</div>
<div id="erreur"></div>
<script>window.addEventListener('error',e=>{document.getElementById('erreur').textContent='Erreur : '+e.message})</script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

const W=400,H=740,GRAV=1350,SUB=10,BR=9;
const $=id=>document.getElementById(id);
let rec=0;try{rec=+localStorage.getItem('neonFlipper_record')||0}catch(e){}
const C={cyan:0x19e6ff,rose:0xff3df0,jaune:0xffe94d,vert:0x3dff8a,orange:0xff8a1a,blanc:0xffffff};

/* ================= TABLE (2D, unités = pixels table) ================= */
const segs=[];
function seg(x1,y1,x2,y2,o){const s=Object.assign({x1,y1,x2,y2,r:3,e:.45,col:C.cyan,kind:'mur'},o||{});segs.push(s);return s}
{const N=30;let px=20,py=200;for(let i=1;i<=N;i++){const a=Math.PI+Math.PI*i/N,x=200+180*Math.cos(a),y=200+180*Math.sin(a);seg(px,py,x,y);px=x;py=y}}
seg(20,200,20,555);seg(20,555,112,630);
seg(380,200,380,724);seg(352,250,352,724);seg(352,712,380,712,{col:C.rose});
seg(380,214,352,248,{kind:'porte',col:C.rose,r:2});
seg(352,555,260,630);
for(const x of [85,135,185,235,285])seg(x,98,x,128,{r:4,col:C.rose});
seg(56,252,56,430,{col:C.rose});                         // guide de l'orbite
function sling(m){const X=x=>m?372-x:x;
  seg(X(60),470,X(60),550,{col:C.rose});seg(X(60),550,X(100),575,{col:C.rose});
  return seg(X(60),470,X(100),575,{kind:'sling',col:C.jaune,e:.3,flash:0})}
const slings=[sling(false),sling(true)];
// entrées des rampes
seg(266,296,266,334,{col:C.cyan});seg(314,296,314,334,{col:C.cyan});const rampeR=seg(266,296,314,296,{kind:'rampe',id:'R',col:C.cyan,r:2});
seg(80,356,80,394,{col:C.rose});seg(126,356,126,394,{col:C.rose});const rampeL=seg(80,356,126,356,{kind:'rampe',id:'L',col:C.rose,r:2});
// cibles debout vertes + cibles tombantes orange
const vertes=[0,1,2].map(i=>seg(345,334+i*34,345,360+i*34,{r:4,kind:'verte',idx:i,col:C.vert,e:.35}));
const drops=[0,1,2].map(i=>seg(146+i*30,432,166+i*30,432,{r:4,kind:'drop',idx:i,col:C.orange,e:.35}));
const bumpers=[{x:130,y:232,r:22,f:0},{x:240,y:232,r:22,f:0},{x:186,y:312,r:22,f:0}];
const couloirs=[110,160,210,260];
function flip(px,side){const l=side<0;return{px,py:630,len:60,side,rest:l?.5:Math.PI-.5,up:l?-.45:Math.PI+.45,ang:l?.5:Math.PI-.5,av:0,on:false}}
const fl=[flip(112,-1),flip(260,1)];
const P=(x,y,z)=>new THREE.Vector3(x-200,z||0,y-370);
const RAMPES={
  R:{pts:[[290,302,2],[292,240,18],[302,170,38],[272,96,52],[186,72,58],[100,96,52],[54,170,44],[36,280,34],[36,400,22],[40,490,6],[42,516,0]],sortie:[42,516,0,240],col:C.cyan},
  L:{pts:[[103,362,2],[100,300,16],[94,222,34],[124,140,52],[196,118,72],[280,132,64],[330,192,50],[338,300,34],[334,420,18],[332,494,6],[332,516,0]],sortie:[332,516,0,240],col:C.rose}};
for(const k in RAMPES){const r=RAMPES[k];r.courbe=new THREE.CatmullRomCurve3(r.pts.map(p=>P(p[0],p[1],p[2]+9)));r.len=r.courbe.getLength()}
const MISSIONS=[['RAMPES','rampe',3],['BUMPERS','bumper',25],['TOURS SPINNER','spin',30],['ORBITES','orbite',3],['CIBLES','cible',6]];

/* ================= ETAT ================= */
let G=null,billes=[],timers=[],bandeau=null,shake=0;
function nouvellePartie(){
  G={etat:'jeu',score:0,balls:3,bille:1,mult:1,lanes:[0,0,0,0],lc:[0,0,0,0],vert:[0,0,0],drop:[0,0,0],dropAnim:[0,0,0],lock:false,locked:0,multi:false,mystere:false,
     save:0,arm:true,extra:false,t:0,charge:0,lent:0,skill:-1,skillFin:0,combo:0,comboT:-9,mi:0,mc:0,mlvl:0,spin:0,spinA:0,spinCompte:0,orbT:-9};
  billes=[];timers=[];bandeau=null;nouvelleBille();
}
function nouvelleBille(){billes.push({x:366,y:702,vx:0,vy:0,r:BR,tr:[]});G.skill=Math.floor(Math.random()*4);G.skillFin=0}
const dansCouloir=b=>!b.rampe&&b.x>352&&b.y>640;
const auRepos=b=>dansCouloir(b)&&Math.abs(b.vy)<40&&b.y>690;
function plus(n,x,y,col){n=Math.round(n*G.mult);G.score+=n;if(x!=null)popup(n.toLocaleString('fr-FR'),x,y,col);
  if(!G.extra&&G.score>=250000){G.extra=true;G.balls++;banniere('BILLE EN PLUS !','#3dff8a');son('multi')}}
function banniere(t,col,d){bandeau={t,col:col||'#ff3df0',l:d||2.2,d:d||2.2}}
function apres(s,f){timers.push({t:G.t+s,f})}
function mission(type,k){const m=MISSIONS[G.mi];if(m[1]!==type)return;G.mc+=k||1;const but=Math.round(m[2]*(1+.5*G.mlvl));
  if(G.mc>=but){plus(20000*(G.mlvl+1));banniere('MISSION RÉUSSIE','#ffe94d');son('multi');G.mc=0;G.mi++;if(G.mi>=MISSIONS.length){G.mi=0;G.mlvl++}}}
function missionTxt(){const m=MISSIONS[G.mi],but=Math.round(m[2]*(1+.5*G.mlvl));return[but+' '+m[0],Math.min(G.mc,but)+' / '+but]}
function combo(x,y){if(G.t-G.comboT<4)G.combo++;else G.combo=1;G.comboT=G.t;if(G.combo>=2){plus(2000*G.combo,x,y+20,'#ffe94d');banniere('COMBO ×'+G.combo,'#ffe94d',1.4);son('combo')}}

/* ================= PHYSIQUE ================= */
let nX=0,nY=0;
function colSeg(b,s){
  const dx=s.x2-s.x1,dy=s.y2-s.y1,l2=dx*dx+dy*dy;let t=((b.x-s.x1)*dx+(b.y-s.y1)*dy)/l2;t=t<0?0:t>1?1:t;
  const cx=s.x1+dx*t,cy=s.y1+dy*t;let x=b.x-cx,y=b.y-cy;const d=Math.hypot(x,y),R=b.r+s.r;
  if(d>=R||d<1e-6)return-1;x/=d;y/=d;nX=x;nY=y;
  const vn=b.vx*x+b.vy*y;
  if(s.kind==='rampe'&&-vn>380&&y>0.7){entrerRampe(b,s.id);return-2}
  b.x=cx+x*R;b.y=cy+y*R;
  if(vn<0){b.vx-=(1+s.e)*vn*x;b.vy-=(1+s.e)*vn*y;return-vn}return 0;
}
function colFlip(b,f){
  const tx=f.px+Math.cos(f.ang)*f.len,ty=f.py+Math.sin(f.ang)*f.len,dx=tx-f.px,dy=ty-f.py;
  let t=((b.x-f.px)*dx+(b.y-f.py)*dy)/(f.len*f.len);t=t<0?0:t>1?1:t;
  const cx=f.px+dx*t,cy=f.py+dy*t;let x=b.x-cx,y=b.y-cy;const d=Math.hypot(x,y),R=b.r+(9-4*t);
  if(d>=R||d<1e-6)return;x/=d;y/=d;b.x=cx+x*R;b.y=cy+y*R;
  const rx=cx-f.px,ry=cy-f.py,sx=-f.av*ry,sy=f.av*rx;
  let vx=b.vx-sx,vy=b.vy-sy;const vn=vx*x+vy*y;
  if(vn<0){vx-=1.38*vn*x;vy-=1.38*vn*y;b.vx=vx+sx;b.vy=vy+sy}
}
function entrerRampe(b,id){b.rampe={id,u:0,v:Math.min(900,Math.max(560,-b.vy*.6))};son('rampe')}
function pas(dt){
  for(const f of fl){const c=f.on?f.up:f.rest,old=f.ang,v=26*dt;if(Math.abs(c-f.ang)<=v)f.ang=c;else f.ang+=Math.sign(c-f.ang)*v;f.av=(f.ang-old)/dt}
  for(const b of billes){
    if(b.rampe||b.mort)continue;
    b.vy+=GRAV*dt;b.vx*=.99995;b.vy*=.99995;
    const sp=Math.hypot(b.vx,b.vy);if(sp>2300){b.vx*=2300/sp;b.vy*=2300/sp}
    const py=b.y;b.x+=b.vx*dt;b.y+=b.vy*dt;
    for(const s of segs){
      if(s.kind==='porte'&&b.vy<=0)continue;
      if(s.kind==='drop'&&G.drop[s.idx])continue;
      const imp=colSeg(b,s);if(imp===-2)break;if(imp<0)continue;
      if(s.kind==='sling'&&imp>60){b.vx+=nX*560;b.vy+=nY*560;s.flash=1;plus(30);etincelles(b.x,b.y,C.jaune,10);son('sling');shake=Math.max(shake,2)}
      else if(s.kind==='verte'&&imp>40&&!G.vert[s.idx]){G.vert[s.idx]=1;plus(1000,b.x-24,b.y,'#3dff8a');etincelles(b.x,b.y,C.vert,16);son('cible');mission('cible');
        if(G.vert.every(v=>v)){G.mystere=true;G.vert=[0,0,0];banniere('MYSTÈRE À L\'ORBITE','#3dff8a');son('multi')}}
      else if(s.kind==='drop'&&imp>60){G.drop[s.idx]=1;plus(1500,(s.x1+s.x2)/2,s.y1-10,'#ff8a1a');etincelles((s.x1+s.x2)/2,s.y1,C.orange,18);son('drop');mission('cible');shake=Math.max(shake,3);
        if(G.drop.every(v=>v)){if(G.multi){plus(5000);apres(.8,()=>G.drop=[0,0,0])}else{G.lock=true;banniere('LOCK ALLUMÉ','#ff8a1a');son('multi')}}}
      else if(imp>240&&s.kind==='mur')son('tic')}
    if(b.rampe)continue;
    for(const u of bumpers){let x=b.x-u.x,y=b.y-u.y;const d=Math.hypot(x,y),R=b.r+u.r;
      if(d<R&&d>1e-6){x/=d;y/=d;b.x=u.x+x*R;b.y=u.y+y*R;const vn=b.vx*x+b.vy*y;b.vx+=(760-vn)*x;b.vy+=(760-vn)*y;
        u.f=1;plus(100,u.x,u.y-26,'#19e6ff');etincelles(b.x-x*9,b.y-y*9,C.cyan,14);son('bumper');shake=Math.max(shake,3);mission('bumper');flashBumper(u)}}
    for(const f of fl)colFlip(b,f);
    // couloirs N-E-O-N (+ skill shot)
    if(b.y>100&&b.y<126)couloirs.forEach((c,i)=>{if(Math.abs(b.x-c)<20&&G.lc[i]<=0){G.lc[i]=.6;
      if(G.skillFin&&G.t<G.skillFin){if(i===G.skill){plus(15000,c,150,'#ffe94d');banniere('SKILL SHOT !','#ffe94d');son('multi');shake=8}G.skillFin=0}
      if(!G.lanes[i]){G.lanes[i]=1;plus(500,c,150,'#ff3df0');son('lane');
        if(G.lanes.every(v=>v)){G.lanes=[0,0,0,0];G.mult=Math.min(5,G.mult+1);plus(5000);banniere('MULTIPLICATEUR ×'+G.mult,'#ffe94d');son('multi');shake=6}}else plus(100)}})
    // spinner + orbite
    if(b.x<56&&b.x>20){
      if((py-380)*(b.y-380)<=0){G.spin+=Math.abs(b.vy)/90;son('spin')}
      if(py>=255&&b.y<255&&b.vy<0&&G.t-G.orbT>1){G.orbT=G.t;plus(3000,38,240,'#19e6ff');mission('orbite');combo(38,240);son('orbite');
        if(G.mystere){G.mystere=false;mystere()}}}
  }
  for(let i=0;i<billes.length;i++)for(let j=i+1;j<billes.length;j++){const a=billes[i],c=billes[j];if(a.rampe||c.rampe)continue;let x=c.x-a.x,y=c.y-a.y;const d=Math.hypot(x,y);
    if(d<18&&d>1e-6){x/=d;y/=d;const o=(18-d)/2;a.x-=x*o;a.y-=y*o;c.x+=x*o;c.y+=y*o;const vn=(c.vx-a.vx)*x+(c.vy-a.vy)*y;if(vn<0){a.vx+=vn*x;a.vy+=vn*y;c.vx-=vn*x;c.vy-=vn*y}}}
}
function mystere(){const r=Math.random();
  if(r<.35){plus(10000,60,240,'#fff');banniere('MYSTÈRE : 10 000','#3dff8a')}
  else if(r<.55){G.save=G.t+20;banniere('BILLE PROTÉGÉE 20 s','#3dff8a')}
  else if(r<.75){G.mult=Math.min(5,G.mult+1);banniere('MULTIPLICATEUR ×'+G.mult,'#ffe94d')}
  else if(r<.9){G.lock=true;banniere('LOCK ALLUMÉ','#ff8a1a')}
  else{plus(30000,60,240,'#ffe94d');banniere('MYSTÈRE : 30 000 !','#ffe94d')}son('multi')}
function sortieRampe(b){const r=RAMPES[b.rampe.id],id=b.rampe.id;b.rampe=null;const s=r.sortie;b.x=s[0];b.y=s[1];b.vx=0;b.vy=s[3];
  const ex=id==='R'?60:310;
  plus(4000,ex,470,id==='R'?'#19e6ff':'#ff3df0');mission('rampe');combo(ex,470);son('sortie');
  if(G.multi){plus(25000,ex,440,'#ffe94d');banniere('JACKPOT !','#ffe94d');son('multi');shake=10;etincelles(ex,480,C.jaune,40)}
  else if(id==='L'&&G.lock){G.lock=false;G.locked++;b.mort=true;son('lock');
    if(G.locked>=2){banniere('MULTIBALL !','#ff3df0',2.6);son('multi');shake=14;G.multi=true;const n=G.locked+1;G.locked=0;
      for(let k=0;k<n;k++)apres(.5+k*.7,()=>{billes.push({x:332,y:500,vx:(Math.random()-.5)*80,vy:260,r:BR,tr:[]});son('lance')});
      apres(.5+n*.7,()=>{G.drop=[0,0,0]});G.save=G.t+12}
    else{banniere('BILLE BLOQUÉE '+G.locked+'/2','#ff8a1a');apres(1.2,()=>{G.drop=[0,0,0];nouvelleBille()})}}
}
function maj(dt){
  G.t+=dt;
  for(let i=timers.length-1;i>=0;i--)if(timers[i].t<=G.t){const f=timers[i].f;timers.splice(i,1);f()}
  if(G.etat!=='jeu')return;
  const repos=billes.filter(auRepos);
  if(fl[1].on&&repos.length)G.charge=Math.min(1,G.charge+dt*1.1);
  if(!fl[1].on&&G.charge>0){if(repos.length){for(const b of repos)b.vy=-(1050+1050*G.charge);son('lance');G.skillFin=G.t+5;if(G.arm){G.arm=false;G.save=G.t+10}}G.charge=0}
  $('charge').style.height=(repos.length?G.charge*160:0)+'px';
  for(const b of billes)if(b.rampe){b.rampe.u+=b.rampe.v*dt/RAMPES[b.rampe.id].len;if(b.rampe.u>=1)sortieRampe(b)}
  billes=billes.filter(b=>!b.mort);
  const h=dt/SUB;for(let i=0;i<SUB;i++)pas(h);
  for(let i=0;i<4;i++)G.lc[i]-=dt;
  for(const u of bumpers)u.f=Math.max(0,u.f-dt*4);for(const s of slings)s.flash=Math.max(0,s.flash-dt*5);
  G.spinA+=G.spin*dt*6.283;const avant=G.spinCompte;G.spinCompte+=G.spin*dt;if(Math.floor(G.spinCompte)>Math.floor(avant)){plus(150);mission('spin')}G.spin*=Math.pow(.25,dt);
  const libres=billes.filter(b=>!b.rampe&&!dansCouloir(b));
  if(libres.length&&libres.every(b=>Math.hypot(b.vx,b.vy)<8)){G.lent+=dt;if(G.lent>3){for(const b of libres){b.vy=-500;b.vx=(Math.random()-.5)*300}G.lent=0}}else G.lent=0;
  for(let i=billes.length-1;i>=0;i--)if(billes[i].y>H+30){billes.splice(i,1);
    if(billes.length===1&&G.multi){G.multi=false;banniere('FIN DU MULTIBALL','#19e6ff')}
    if(!billes.length){
      if(G.t<G.save){banniere('BILLE SAUVÉE !','#3dff8a');son('multi');nouvelleBille();G.save=0}
      else{son('perdu');G.balls--;G.multi=false;G.mult=1;
        if(G.balls<=0){banniere('GAME OVER','#ff3df0',3);apres(2,finPartie)}
        else{banniere('BILLE PERDUE','#ff3df0');apres(1.8,()=>{G.arm=true;G.bille++;nouvelleBille()})}}}}

    else{const m=missionTxt();couleur='#19e6ff';txt('MISSION',64,5,6);txt(m[0],64,16,10,900);txt(m[1],64,27,7)}}
  const d=lx.getImageData(0,0,128,32).data,w=dmd.width,h=dmd.height,p=w/128;dctx.fillStyle='#0a0204';dctx.fillRect(0,0,w,h);
  const r=p*.4;dctx.fillStyle='#2a0d12';for(let y=0;y<32;y++)for(let x=0;x<128;x++){if(d[(y*128+x)*4]<100){dctx.fillRect(x*p+p*.1,y*(h/32)+p*.1,r*2,r*2)}}
  dctx.fillStyle=couleur;dctx.shadowColor=couleur;dctx.shadowBlur=p*1.2;
  for(let y=0;y<32;y++)for(let x=0;x<128;x++){if(d[(y*128+x)*4]>=100){dctx.fillRect(x*p+p*.1,y*(h/32)+p*.1,r*2,r*2)}}dctx.shadowBlur=0}
addEventListener('resize',dmdTaille);

/* ================= SON ================= */
let ac=null,mg=null,sg=null,musique=true,nT=0,pasM=0;
try{musique=localStorage.getItem('neonFlipper_musique')!=='0'}catch(e){}
function audio(){if(ac){if(ac.state==='suspended')ac.resume();return}
  try{ac=new (window.AudioContext||window.webkitAudioContext)();sg=ac.createGain();sg.gain.value=.5;sg.connect(ac.destination);mg=ac.createGain();mg.gain.value=musique?.07:0;mg.connect(ac.destination);nT=ac.currentTime+.1}catch(e){ac=null}}
function bip(f,d,type,v,f2,quand){if(!ac)return;const t=quand||ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(v||.2,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(sg);o.start(t);o.stop(t+d+.02)}
let dTic=0,dSpin=0;
function son(n){if(!ac)return;const t=ac.currentTime;
  if(n==='bumper'){bip(620,.14,'square',.16,240);bip(1240,.08,'sine',.1)}
  else if(n==='sling')bip(330,.1,'triangle',.25,160);
  else if(n==='flip')bip(110,.06,'square',.12,60);
  else if(n==='lane'){bip(880,.08,'square',.12);bip(1320,.12,'square',.12,null,t+.07)}
  else if(n==='cible')bip(700,.1,'sawtooth',.12,1400);
  else if(n==='drop'){bip(180,.15,'square',.2,90);bip(900,.1,'sine',.1)}
  else if(n==='rampe')bip(300,.6,'sawtooth',.1,1200);
  else if(n==='sortie'){bip(1200,.1,'square',.1);bip(1600,.15,'square',.1,null,t+.08)}
  else if(n==='orbite')bip(400,.4,'triangle',.18,1600);
  else if(n==='spin'){if(t-dSpin>.04){dSpin=t;bip(2400,.02,'square',.04)}}
  else if(n==='lock'){bip(120,.5,'sawtooth',.25,40);bip(800,.3,'square',.1,200,t+.1)}
  else if(n==='combo'){[660,880,1100].forEach((f,i)=>bip(f,.12,'square',.12,null,t+i*.05))}
  else if(n==='lance')bip(150,.35,'sawtooth',.12,900);
  else if(n==='tic'){if(t-dTic>.05){dTic=t;bip(1800,.03,'sine',.05)}}
  else if(n==='perdu')bip(500,.8,'sawtooth',.18,60);
  else if(n==='multi'){[523,659,784,1047,1319].forEach((f,i)=>bip(f,.18,'square',.13,null,t+i*.07))}}
const ACC=[[45,[57,60,64]],[41,[57,60,65]],[48,[55,60,64]],[43,[55,59,62]]],hz=m=>440*Math.pow(2,(m-69)/12);
function planifier(){if(!ac||!musique)return;const e=60/116/2;
  while(nT<ac.currentTime+.25){const bar=Math.floor(pasM/8)%4,[ba,ch]=ACC[bar],s=pasM%8;
    const o=ac.createOscillator(),g=ac.createGain(),fi=ac.createBiquadFilter();o.type='sawtooth';o.frequency.value=hz(ba+(s%2?12:0));fi.type='lowpass';fi.frequency.value=700;
    g.gain.setValueAtTime(.5,nT);g.gain.exponentialRampToValueAtTime(.01,nT+e*.9);o.connect(fi);fi.connect(g);g.connect(mg);o.start(nT);o.stop(nT+e);
    const o2=ac.createOscillator(),g2=ac.createGain();o2.type='square';o2.frequency.value=hz(ch[s%3]+12);g2.gain.setValueAtTime(.18,nT);g2.gain.exponentialRampToValueAtTime(.005,nT+e*.8);o2.connect(g2);g2.connect(mg);o2.start(nT);o2.stop(nT+e);
    if(s%4===0){const k=ac.createOscillator(),kg=ac.createGain();k.frequency.setValueAtTime(140,nT);k.frequency.exponentialRampToValueAtTime(40,nT+.15);kg.gain.setValueAtTime(.9,nT);kg.gain.exponentialRampToValueAtTime(.01,nT+.18);k.connect(kg);kg.connect(mg);k.start(nT);k.stop(nT+.2)}
    pasM++;nT+=e}}
setInterval(planifier,100);
function majSon(){$('son').style.opacity=musique?1:.4;if(mg)mg.gain.value=musique?.07:0;if(ac)nT=Math.max(nT,ac.currentTime+.05)}
$('son').onclick=e=>{e.stopPropagation();audio();musique=!musique;try{localStorage.setItem('neonFlipper_musique',musique?'1':'0')}catch(e){}majSon()};

/* ================= COMMANDES ================= */
const touches=new Map();
function majPalettes(){let g=false,d=false;for(const v of touches.values()){if(v<0)g=true;else d=true}
  [[0,g],[1,d]].forEach(([i,on])=>{const jeu=G&&G.etat==='jeu';if(on&&!fl[i].on&&jeu){son('flip');const l=G.lanes;G.lanes=i===0?[l[1],l[2],l[3],l[0]]:[l[3],l[0],l[1],l[2]]}fl[i].on=on&&!!jeu})}
zone.addEventListener('pointerdown',e=>{e.preventDefault();audio();const r=zone.getBoundingClientRect();touches.set('p'+e.pointerId,(e.clientX-r.left)<r.width/2?-1:1);majPalettes()});
const lacher=e=>{touches.delete('p'+e.pointerId);majPalettes()};
zone.addEventListener('pointerup',lacher);zone.addEventListener('pointercancel',lacher);zone.addEventListener('pointerleave',lacher);
const KG=['ArrowLeft','KeyZ','KeyA','ShiftLeft'],KD=['ArrowRight','KeyM','KeyL','ShiftRight','Space','ArrowDown','Enter'];
addEventListener('keydown',e=>{if(e.repeat)return;if(KG.includes(e.code))touches.set(e.code,-1);else if(KD.includes(e.code))touches.set(e.code,1);else return;e.preventDefault();audio();majPalettes()});
addEventListener('keyup',e=>{if(touches.delete(e.code))majPalettes()});
addEventListener('contextmenu',e=>e.preventDefault());
function demarrer(){audio();majSon();$('menu').hidden=true;$('fin').hidden=true;touches.clear();nouvellePartie();majPalettes()}
$('jouer').onclick=demarrer;$('rejouer').onclick=demarrer;
$('recMenu').textContent=rec?'Record : '+rec.toLocaleString('fr-FR'):'';

/* ================= BOUCLE ================= */
let der=performance.now(),dDmd=0;
function boucle(now){const dt=Math.min(.033,(now-der)/1000);der=now;
  if(G){maj(dt)}
  if(bandeau){bandeau.l-=dt;if(bandeau.l<=0)bandeau=null}
  shake=Math.max(0,shake-dt*30);
  rendu(dt);dDmd+=dt;if(dDmd>.05){dDmd=0;dessinDMD()}
  requestAnimationFrame(boucle)}
cadrer();dmdTaille();majSon();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{const tx=texSol();sol.material.map=tx;sol.material.emissiveMap=tx;sol.material.needsUpdate=true});
requestAnimationFrame(boucle);
window.__flipper={get G(){return G},billes:()=>billes,fl,touches,majPalettes,RAMPES};
</script>
